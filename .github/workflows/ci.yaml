# CI for product catalog servcie
name: product-catalog-service CI
on:
  pull_request:
    branches: 
      - main
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:  
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Go 1.22
        uses: actions/setup-go@v2
        with:
          go-version: 1.22

      - name: Build with Go
        run: |
          cd src/product-catalog
          go mod download
          go build -o product-catalog-service main.go

      - name: Unit tests
        run: |
          cd src/product-catalog
          go test ./...

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Go 1.22
        uses: actions/setup-go@v2
        with:
          go-version: 1.22

      - name: Run golangci-lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
            version: v1.56.2
            working-directory: src/product-catalog

  docker:
    runs-on: ubuntu-latest
    
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Docker push
        uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: tru
          tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog-service:${{ github.run_id }}
  
  deploy:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: update tag in k8s deployments
        run: |
             sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog-service:${{github.run_id}}|" kubernetes/productcatalog/deploy.yaml

      - name: commit and push changes
        run: |             
          git config --global user.name "srikanth240695"
          git config --global user.email "srikanth8095@gmail.com"
          git add kubernetes/productcatalog/deploy.yaml
          git commit -m "[CI]: Update product catalog image tag"
          git push origin HEAD:main -f

